name: Decompress and Decompile Binaries

on:
  push:
    paths:
      - '**.apk'
      - '**.ipa'
      - '**.exe'
      - '**.deb'
      - '**.zip'
  workflow_dispatch:

jobs:
  decompress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full dpkg-dev wget unzip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JADX (Decompiler)
        run: |
          wget https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          unzip -q jadx-1.5.0.zip -d jadx-tools
          sudo ln -s $(pwd)/jadx-tools/bin/jadx /usr/local/bin/jadx

      - name: Find, Decompress and Decompile Files
        run: |
          mkdir -p extracted_files
          
          # Buscar archivos binarios recursivamente
          find . -type f \( -name "*.apk" -o -name "*.ipa" -o -name "*.exe" -o -name "*.deb" -o -name "*.zip" \) | while read -r file; do
            echo "Procesando archivo: $file"
            filename=$(basename -- "$file")
            extension="${filename##*.}"
            dirname="extracted_files/${filename}_extracted"
            mkdir -p "$dirname"
            
            case "$extension" in
              apk)
                echo "Extrayendo recursos visuales del APK..."
                unzip -q "$file" -d "$dirname" || echo "Aviso con unzip en $filename"
                
                echo "Descompilando código fuente del APK con JADX..."
                mkdir -p "$dirname/source_code"
                jadx -d "$dirname/source_code" "$file" || echo "Aviso con JADX en $filename"
                ;;
              ipa|zip)
                echo "Extrayendo archivo tipo ZIP/IPA..."
                unzip -q "$file" -d "$dirname" || echo "Aviso con $filename"
                ;;
              exe)
                echo "Extrayendo ejecutable PE (EXE) con 7z..."
                7z x "$file" -o"$dirname" -y
                ;;
              deb)
                echo "Extrayendo paquete Debian (DEB)..."
                dpkg-deb -x "$file" "$dirname"
                ;;
            esac
          done

      - name: Upload Extracted Files
        uses: actions/upload-artifact@v4
        with:
          name: decompressed-and-decompiled-outputs
          path: extracted_files/
          retention-days: 5
